services:
  api:
    build: .
    env_file: .env
    volumes:
      - paperlife_data:/data
      - ./private:/run/private:ro
    restart: unless-stopped
    networks: [paperlife]
  edge:
    image: caddy:2-alpine
    environment:
      PAPERLIFE_DOMAIN: ${PAPERLIFE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      paperlife:
        ipv4_address: 172.30.20.2
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
networks:
  paperlife:
    ipam:
      config:
        - subnet: 172.30.20.0/24
volumes:
  paperlife_data:
  caddy_data:
  caddy_config:
